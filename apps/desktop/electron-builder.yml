appId: com.pi.work
productName: PiWork
# Skip native module rebuild — pnpm workspace compat.
npmRebuild: false

directories:
  buildResources: build
  output: release

# Electron 42+ no longer downloads its binary during `pnpm install`, so
# electron-builder fetches it at pack time — and github.com releases are not
# reachable from the network this repo is built on. The npmmirror build is the
# same unsigned binary. Delete this block (or set ELECTRON_MIRROR) on a machine
# that can reach GitHub.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# App icon (512x512 PNG). electron-builder auto-converts to .icns (macOS) and .ico (Windows).
icon: build/icon.png

# Let electron-builder auto-detect production dependencies from package.json.
# We only need to include the electron-vite output; electron-builder will pull in the
# necessary node_modules based on the "dependencies" field.
files:
  - out/**/*

# Native .node addons inside @earendil-works/pi-coding-agent must be unpacked
# from the asar archive so they can be loaded by Node at runtime.
asarUnpack:
  - "node_modules/@earendil-works/pi-coding-agent/**/*"
  - "node_modules/@mariozechner/clipboard*/**/*"
  # Built-in voice: prebuilt N-API addon + platform runtime libs. `.node`,
  # `.dylib` and `.so` files cannot be loaded from inside an asar archive.
  - "node_modules/sherpa-onnx-node/**/*"
  - "node_modules/sherpa-onnx-*/**/*"
  - "**/node_modules/sherpa-onnx-node/**/*"
  - "**/node_modules/sherpa-onnx-*/**/*"
  # The inference worker is forked by path; keep it and the code-split chunks
  # it imports outside the asar so Node can resolve them from the unpacked dir.
  - "out/main/voice-worker.mjs"
  - "out/main/chunks/**/*"

# Strip sherpa packages for other platforms after packing, fail the build if
# the target platform's addon is missing, and (on Windows) copy the bundled
# plugin market ourselves — electron-builder's copy of the 21 MB
# com.pi.files zip hits EBUSY there. See scripts/after-pack.cjs.
afterPack: "./scripts/after-pack.cjs"

# ── No built-in plugins, but a bundled offline market ──
#
# Every plugin is distributed through the plugin marketplace and installed to
# `~/.pi/agent/plugins/` (the registry's `user` root). A packaged app therefore
# starts with ZERO plugins INSTALLED: two host panels (settings, plugin center)
# and nothing else, and the user installs what they want.
#
# This was not always the case. A release build once shipped with no plugins
# either, which looked like a bug and was "fixed" by bundling the repo's
# `plugins/` directory into the app as the builtin root. That fix created a
# worse problem: the `user` root outranks `builtin`, so any plugin the user had
# installed SHADOWED the bundled copy — a stale install silently won over a
# fresh build-in, and the bundled copies were dead weight nobody ever loaded.
# If you are here because a packaged app has no plugins: that is the intended
# state. Ship the plugin to the marketplace instead of bundling it.
#
# What IS bundled is the market itself (pack scripts run
# scripts/build-market.mjs into `market-dist/` first): index.json + one zip per
# first-party plugin, copied to `<resources>/market/`. The registry falls back
# to it when neither PI_PLUGIN_REGISTRY nor _state.json#registry names another
# source, so a fresh install can install plugins offline. The zips are
# referenced by paths relative to the index — an absolute build-machine path
# would dangle after the install moves.
#
# Windows still ships a shell bundle — that is a runtime dependency of the
# agent's bash tool, not a plugin.
extraResources:
  - from: "market-dist/"
    to: "market/"

# Office document support used to ship here as a bundled `officecli` skill
# plus a binary fetched at startup. It is now a plugin (com.pi.files) running
# the vendored GenOffice engines in its own backend — nothing to bundle and
# nothing to download.

mac:
  category: public.app-category.developer-tools
  # Electron 44 dropped macOS 12. Pin the floor in the bundle so a download
  # does not land on a machine that cannot launch it (Electron 45 needs 13+).
  minimumSystemVersion: "13.0"
  # No Developer ID in the pipeline, and without this electron-builder
  # auto-discovers whatever identity happens to sit in the build machine's
  # keychain (an Apple *Development* one here) and then fails on
  # `codesign --timestamp` whenever Apple's timestamp service is unreachable.
  # The bundle is still ad-hoc signed in afterPack (adhoc-sign-mac.cjs) so a
  # quarantined download does not show up as "已损坏" — it gets the normal
  # "无法验证开发者" prompt instead. Delete this line — and fill in the
  # hardenedRuntime / entitlements block below — once a Developer ID identity
  # exists.
  identity: null
  extendInfo:
    # Required by macOS before the app may open the microphone (语音转写).
    NSMicrophoneUsageDescription: PiWork 需要访问麦克风，把语音转写成文字。
  target:
    - dmg
    - zip
  # Code signing: requires Apple Developer account.
  # Uncomment and set these when you have a signing identity:
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

win:
  # Bundle MinGit BusyBox (shell + git + coreutils) so Windows users
  # get bash-like command execution out of the box.
  #
  # Platform-level extraResources OVERRIDE the top-level list rather than
  # extending it — which is why the market is absent here: on Windows it is
  # copied by afterPack instead (electron-builder's copy of the 21 MB
  # com.pi.files zip fails with EBUSY on the runners). See scripts/after-pack.cjs.
  #
  # Build this target on Windows — macOS cross-builds are blocked twice:
  # rcedit needs wine and makensis ships x86_64-only, both unusable on
  # Apple Silicon without Rosetta.
  extraResources:
    - from: "bash-bundle/"
      to: "bash-bundle/"
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # Code signing for Windows (requires certificate):
  # certificateFile: build/cert.pfx
  # certificatePassword: ${CERT_PASSWORD}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: pi@example.com
  executableName: piwork
  # deb 的文件名模板默认用 ${name}，scoped 包名 @pi/desktop 里的 / 会被当成
  # 目录分隔符（release/@pi/...），而该目录不会被创建，fpm 直接报
  # "Parent directory does not exist"。显式给出不带斜杠的产物名绕开它。
  artifactName: PiWork-${version}-${arch}.${ext}

deb:
  packageName: piwork
