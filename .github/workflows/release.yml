name: Release

# 打 tag 触发：先跑与 CI 相同的测试门禁，再在四个平台上打包，最后把安装包
# 挂到 GitHub Release 的 Assets 上。
#
# 版本号真源是 apps/desktop/package.json —— tag 必须与它完全一致，否则在
# 打包前就失败（省下四台 runner 的时间）。
#
# 第一阶段不做代码签名：产物会被 macOS Gatekeeper / Windows SmartScreen
# 拦一次，用户手动允许即可。安装说明同时写进 DMG 和 Release notes
# （apps/desktop/build/install-notes.txt、.github/release-notes/install.md）。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # 没有签名证书也照常出包（electron-builder 的自动探测会让位）。
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # ── 门禁：与 ci.yml 同一套检查 ──────────────────────────────────────
  verify:
    name: Verify (build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ── 插件市场：构建一次，四个平台共用 ────────────────────────────────
  # 首方插件的面板产物（plugins/*/ui-dist）是 gitignore 的构建输出，干净
  # checkout 里没有；而每个打包 job 各装一遍依赖太贵（com.pi.files 一个就
  # 约 790 MB，乘四个 runner）。所以在这里构建一次，打包 job 下载同一个
  # artifact —— 之前那套「构建不出来就空市场出包」的兜底因此可以删掉：
  # 一个没有插件的安装包不如出包失败。
  market:
    name: Build plugin market
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 插件通过 file:../../packages/plugin-sdk 依赖宿主包，而它的入口是
      # packages/*/dist —— 必须先把宿主包构建出来，插件才装得上、编得过。
      - name: Build packages
        run: pnpm build

      # 装插件依赖 + 构建 + 打包成市场，三步合成一个脚本：
      # Windows 打包 job 要就地构建同一份东西，两处共用同一个实现。
      - name: Build plugins and market index
        run: node scripts/ci-build-market.mjs market-dist

      # 空市场的安装包看起来和正常的一样，只是用户装上后发现什么都没有。
      - name: Assert the market is not empty
        run: |
          node -e "
            const idx = require('./market-dist/index.json');
            const plugins = idx.plugins ?? [];
            console.log('market plugins:', plugins.map((p) => p.id + '@' + p.version).join(', ') || '(none)');
            if (plugins.length === 0) {
              console.error('::error::market index contains no plugins');
              process.exit(1);
            }
          "

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-market
          path: market-dist/
          if-no-files-found: error
          compression-level: 0

  # ── 打包：一个平台一个 runner，互不阻塞 ─────────────────────────────
  build:
    name: Package (${{ matrix.name }})
    needs: [verify, market]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows 上也要用 bash：下面的脚本与 glob 都是 POSIX 写法。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            platform: mac
            arch: arm64
          # Intel 架构需要 x64 runner，交叉产出不可靠（原生依赖按宿主架构装）。
          - name: macos-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "tag:     v${tag}"
          echo "version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag v${tag} 与 apps/desktop/package.json 的 version ${version} 不一致：改版本号后重新打 tag。"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 安装包会把插件市场打进 <resources>/market/。市场由上面的 `market`
      # job 统一构建，这里只取现成的 —— 不再有「构建不出来就空市场出包」
      # 的兜底：拿不到就是流程出错，应当出包失败。
      # 注意 market-dist/ 必须落在 apps/desktop/ 下：electron-builder.yml 的
      # extraResources 是相对 app 目录解析的（与 pack:* 脚本一致）。
      - name: Fetch the prebuilt plugin market
        if: matrix.platform != 'win'
        uses: actions/download-artifact@v8
        with:
          name: plugin-market
          path: apps/desktop/market-dist

      # Windows 不走 artifact：从 artifact 解出来的 zip 会被实时防护持有句柄，
      # electron-builder 把它复制进 resources/market/ 时稳定 EBUSY（重试也过不去，
      # 而且只有 com.pi.files 那个 21 MB 的包会中招）。
      - name: Build the plugin market in place (Windows)
        if: matrix.platform == 'win'
        run: node scripts/ci-build-market.mjs apps/desktop/market-dist

      # 再把市场整体复制一遍。两个作用：
      # 1) 读一遍源文件 —— 如果这一步就失败，说明锁在源文件上，日志会写清楚；
      # 2) electron-builder 接下来读到的是我们刚用普通文件 API 写出来的副本，
      #    而不是 build-market 里 adm-zip 产生的那些。
      - name: 'Windows: re-materialise the market'
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $src = "apps\desktop\market-dist"
          $tmp = "apps\desktop\market-dist.tmp"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $src $tmp -Recurse -Force
          Get-ChildItem $tmp -Filter *.zip | ForEach-Object {
            $null = Get-FileHash $_.FullName -Algorithm SHA256
            Write-Host ("  {0}  {1:N1} MB  readable" -f $_.Name, ($_.Length / 1MB))
          }
          Remove-Item $src -Recurse -Force
          Move-Item $tmp $src
          Write-Host "market re-materialised:" (Get-ChildItem $src -Filter *.zip).Count "zips"

      - name: Assert the market arrived
        run: |
          node -e "
            const idx = require('./apps/desktop/market-dist/index.json');
            const n = (idx.plugins ?? []).length;
            console.log('bundled market plugins:', n);
            if (n === 0) { console.error('::error::the bundled market is empty'); process.exit(1); }
          "

      # Windows 运行时依赖 bash（MinGit busybox），打包前必须下载到 bash-bundle/。
      - name: Download Windows shell bundle
        if: matrix.platform == 'win'
        run: node apps/desktop/scripts/download-bash-bundle.cjs

      # Windows 的实时防护会扫刚从 artifact 解出来的 zip，扫描期间文件被占用，
      # electron-builder 复制进 resources/market/ 时会 EBUSY。装插件之后才会
      # 复制大 zip，所以这个失败是加了插件市场才暴露出来的。
      - name: 'Windows: keep Defender out of the workspace'
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue

      # pnpm 的 workspace 软链会让 electron-builder 去包目录外找文件。
      - name: Prepare packaging
        run: node apps/desktop/scripts/prepare-pack.cjs

      # 再留一次重试：EBUSY 是竞态，排除目录能大幅降低概率但不能证明为零。
      - name: Package
        working-directory: apps/desktop
        run: |
          for attempt in 1 2; do
            if pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never; then
              exit 0
            fi
            echo "::warning::electron-builder failed (attempt ${attempt}); retrying"
            sleep 15
          done
          echo "::error::electron-builder failed twice"
          exit 1

      - name: Check expected installers exist
        run: |
          case "${{ matrix.platform }}" in
            mac)   patterns="*.dmg *.zip" ;;
            win)   patterns="*.exe" ;;
            linux) patterns="*.AppImage *.deb" ;;
          esac
          for pattern in $patterns; do
            ls apps/desktop/release/$pattern > /dev/null || {
              echo "::error::packaging produced no ${pattern} for ${{ matrix.name }}"
              exit 1
            }
          done

      # 没有 Developer ID 时，DMG 里的安装说明就是用户唯一的离线指引。它不在
      # 说明 dmg.contents 的相对路径前提被破坏了 —— 宁可出包失败，也别把一个
      # 双击没反应又没有任何提示的安装包发出去。
      - name: Check the DMG carries the install notes
        if: matrix.platform == 'mac'
        run: |
          dmg="$(ls apps/desktop/release/*.dmg | head -1)"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" > /dev/null
          status=0
          if [ -f "$mountpoint/安装说明.txt" ]; then
            echo "install notes found in $dmg"
          else
            echo "::error::$dmg does not contain 安装说明.txt"
            ls -la "$mountpoint"
            status=1
          fi
          hdiutil detach "$mountpoint" > /dev/null
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          # 只收安装包本身，忽略 blockmap / latest*.yml 等更新元数据。
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          compression-level: 0

  # ── 发布：把四个平台的产物挂到同一个 Release ────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 唯一需要写权限的 job：创建 Release 并上传 Assets。
      contents: write
    steps:
      # body_path 指向仓库里的文件。这个 job 以前没有 checkout，文件根本不存在，
      # action-gh-release 只打一行 warning 就退回空 body —— v0.3.3 的 Release
      # notes 里因此没有安装提示，而且流水线照样绿。checkout 加下面的断言把
      # 这类静默降级变成构建失败。
      - uses: actions/checkout@v7

      # 只取安装包产物。不写 pattern 会把 plugin-market 那个 artifact 也下载
      # 下来，于是每个插件的 zip 和 index.json 都会作为 Release asset 挂出去
      # ——它们是打进安装包里的中间产物，不是给用户下载的文件。
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true

      # body_path 读不到时 action 只警告不报错（见 util.ts 的 releaseBody），
      # 所以文件在不在必须自己断。
      - name: Check the install notes are present
        run: |
          test -s .github/release-notes/install.md || {
            echo "::error::.github/release-notes/install.md 缺失或为空，Release notes 里不会有安装提示"
            exit 1
          }

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # body 会排在自动生成的更新说明前面。没有 Developer ID 时这是用户
          # 唯一的安装指引，DMG 里也放了同一份（见 electron-builder.yml 的 dmg）。
          body_path: .github/release-notes/install.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          # v0.2.0-beta.1 这类带后缀的 tag 自动标为预发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
