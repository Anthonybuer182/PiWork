name: 功能建议
description: 提议一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先描述当前的痛点和场景，而不是直接给方案。
      placeholder: 当我……的时候，我希望……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决？
      description: 你设想的功能或交互是什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他做法，或现在是怎么绕过去的？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关功能
      options:
        - 对话
        - 插件
        - 文件与面板
        - 设置
        - 模型服务商
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue，确认没有重复。
          required: true
