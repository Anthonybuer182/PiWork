name: Bug 报告
description: 报告 PiWork 的问题或异常行为
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！信息越完整，问题越容易被复现和修复。
        从 PiWork 的「设置 → 关于 → 报告问题」进入时，版本和系统信息已经自动填好。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？
      placeholder: 简单描述你遇到的问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写下能稳定触发这个问题的操作。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 有报错信息、控制台日志或截图就贴在这里。粘贴前请先去掉密钥、令牌等敏感信息。
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: PiWork 版本
      description: 可在「设置 → 关于」中查看。
      placeholder: 例如 0.23.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 15.1 / Windows 11 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关功能
      options:
        - 对话
        - 插件
        - 文件与面板
        - 设置
        - 模型服务商
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue，确认没有重复。
          required: true
        - label: 我使用的是最新版本（设置 → 关于 → 检查更新）。
          required: true
